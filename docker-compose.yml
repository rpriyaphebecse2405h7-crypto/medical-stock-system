version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: medicine_stock_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-rootpassword}
      MYSQL_DATABASE: medicine_stock_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/medicine_stock.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: medicine_stock_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-medicine_secret_key}
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rootpassword}
      MYSQL_DB: medicine_stock_db
      MYSQL_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
